<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Login Page</title>
</head>
<body>

    <center>
    <h1 style="color: rgb(186, 11, 169);">  Login to Instagram</h1><br><hr></center>

    <center>
        <table >
    <form action="login account.html">
        <tr>
            <td>Enter your username:</td>
            <td> <input type="text" placeholder="Enter your username" required><br><br></td>
        </tr>
        <tr>
            <td>Enter your password:</td>
            <td> <input type="password" placeholder="Enter your password" required><br><br></td>
        </tr>
        <tr>
            <td>Enter your email:</td>
            <td> <input type="email" placeholder="Enter your email" required><br><br></td>
        </tr>
        <tr>
            <td>Enter your phone number:</td>
            <td> <input type="tel" placeholder="Enter your phone number" required><br><br></td>
        </tr>
        <tr>
            <td>Enter your aadhar number:</td>
            <td> <input type="text" id="aadhar" placeholder="Enter your aadhar number" required><br><br></td>
        </tr>
        <tr>
            <td>Enter your date of birth:</td>
            <td> <input type="date" placeholder="Enter your date of birth" required><br><br></td>
        </tr>
        <tr>
            <td>Upload your photo:</td>
            <td> <input type="file" placeholder="Upload your photo" required><br><br></td>
        </tr>

        <tr>
            
            <td colspan="2"  style="text-align: center; "><button style="background-color: rgb(149, 149, 219);" type="submit">
                Submit your details</button><br><br></td>
        </tr>
    </form>
    </table>
    </center>
    
</body>
</html>
